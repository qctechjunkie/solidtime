  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - ${DOCKER_DATA_PATH}/postgres:/var/lib/postgresql/data
  #   networks:
  #     - solidtime-internal
  #   # Uncomment to expose PostgreSQL on the host (local DB tools only).
  #   # WARNING: Never expose this port to the internet.
  #   # ports:
  #   #   - "${FORWARD_DB_PORT:-5432}:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 7
  #     start_period: 10s
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: solidtime-gotenberg
    restart: unless-stopped
    networks:
      - solidtime-internal
    healthcheck:
      test:
        ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  solidtime-internal:
    driver: bridge
