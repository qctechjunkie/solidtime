# =============================================================================
# Solidtime Docker Compose - Production
# =============================================================================
# Before starting, copy .env.example to .env and fill in your values:
#
#   cp .env.example .env
#
# Generate required secrets before first start:
#   APP_KEY:             docker compose run --rm app php artisan key:generate --show
#   PASSPORT keys:       docker compose run --rm app php artisan passport:keys --show
#
# Create and set permissions for data directories (Linux only):
#   mkdir -p ${DOCKER_DATA_PATH}/{postgres,logs,app-storage}
#   chown -R 1000:1000 ${DOCKER_DATA_PATH}/{logs,app-storage}
#
# Then start Solidtime:
#
#   docker compose up -d
#
# See the Solidtime documentation for full configuration details:
#   https://docs.solidtime.io/self-hosting/guides/docker
# =============================================================================

name: solidtime

services:
  app:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    container_name: solidtime-app
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      CONTAINER_MODE: http
    volumes:
      - ${DOCKER_DATA_PATH}/logs:/var/www/html/storage/logs
      - ${DOCKER_DATA_PATH}/app-storage:/var/www/html/storage/app
    networks:
      - solidtime-internal
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health-check/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    container_name: solidtime-scheduler
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      CONTAINER_MODE: scheduler
    volumes:
      - ${DOCKER_DATA_PATH}/logs:/var/www/html/storage/logs
      - ${DOCKER_DATA_PATH}/app-storage:/var/www/html/storage/app
    networks:
      - solidtime-internal
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  queue:
    image: solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}
    container_name: solidtime-queue
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    volumes:
      - ${DOCKER_DATA_PATH}/logs:/var/www/html/storage/logs
      - ${DOCKER_DATA_PATH}/app-storage:/var/www/html/storage/app
    networks:
      - solidtime-internal
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # database:
  #   image: postgres:17-alpine
  #   container_name: solidtime-database
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE}
